# 网易云爬虫服务 - nginx 反代配置
# 域名: 163.d9g.com.cn
# 后端: FastAPI 127.0.0.1:9700
# 最后更新: 2026-09-03

# HTTP 服务器 - 自动跳转到 HTTPS
server {
    listen 80;
    server_name 163.d9g.com.cn;

    # Let's Encrypt 证书验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他 HTTP 请求跳转到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name 163.d9g.com.cn;

    charset utf-8;
    override_charset on;

    # SSL 证书配置（d9g.com.cn 通配符证书）
    ssl_certificate /etc/letsencrypt/live/d9g.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d9g.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传文件大小限制（歌词导出可能稍大）
    client_max_body_size 10M;

    # WebUI 静态文件 (本项目内置单页应用)
    root /root/netease163/webui/dist;
    index index.html;

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 转发到 FastAPI (完整路径透传)
    location /api/ {
        proxy_pass http://127.0.0.1:9700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # /health 健康检查
    location = /health {
        proxy_pass http://127.0.0.1:9700/health;
        proxy_set_header Host $host;
    }

    # /docs Swagger UI
    location = /docs {
        proxy_pass http://127.0.0.1:9700/docs;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:9700/redoc;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:9700/openapi.json;
        proxy_set_header Host $host;
    }

    # Swagger UI 透传
    location ^~ /docs {
        proxy_pass http://127.0.0.1:9700/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /redoc {
        proxy_pass http://127.0.0.1:9700/redoc;
        proxy_set_header Host $host;
    }

    location ^~ /openapi.json {
        proxy_pass http://127.0.0.1:9700/openapi.json;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
