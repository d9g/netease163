    <script>
        // ==================== 状态 ====================
        const API_BASE = '/api/v1';
        let currentPage = 'search';

        // ==================== 工具 ====================
        async function api(path, params = {}, method = 'GET') {
            const url = new URL(API_BASE + path, window.location.origin);
            // 后端用 Query 类型, GET 和 POST 都通过 query string 传参
            Object.keys(params).forEach(k => {
                if (params[k] !== undefined && params[k] !== '') {
                    url.searchParams.append(k, params[k]);
                }
            });
            const opts = { method };
            const resp = await fetch(url, opts);
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({error: resp.statusText}));
                throw new Error(err.error || err.detail || `HTTP ${resp.status}`);
            }
            return resp.json();
        }

        function toast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.toString().replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function checkLogin() {
            try {
                const data = await api('/login/status');
                const el = document.getElementById('loginStatus');
                if (data.logged_in) {
                    el.className = 'login-status logged-in';
                    el.innerHTML = `✅ 已登录 · <strong>${escapeHtml(data.nickname || data.user_id)}</strong> · <a href="javascript:void(0)" onclick="logout()">登出</a>`;
                } else {
                    el.className = 'login-status logged-out';
                    el.innerHTML = `🔒 未登录 · <a href="javascript:void(0)" onclick="showPage('login')">立即登录</a>`;
                }
            } catch (e) {
                console.error('login status check failed', e);
            }
        }

        async function logout() {
            try {
                await api('/login/logout', {}, 'POST');
                toast('已登出', 'success');
                checkLogin();
            } catch (e) {
                toast('登出失败: ' + e.message, 'error');
            }
        }

        async function loadCandidates(type, q, limit = 10) {
            // 按名称搜索, 返回候选列表
            return await api('/candidates', {q, type, limit});
        }

        function renderCandidates(items, onSelect) {
            // 渲染候选列表 (重名筛选用)
            if (!items || items.length === 0) return '<p style="color: #999;">无结果</p>';
            return items.map((c, i) => {
                const dur = c.duration ? ` · ${Math.floor(c.duration/60000)}:${String(Math.floor((c.duration%60000)/1000)).padStart(2, '0')}` : '';
                const extra = c.extra ? ` · ${escapeHtml(c.extra)}` : '';

        async function loadToplist(name) {
            const el = document.getElementById('toplistDetail');
            el.innerHTML = '<p style="color: #999;">⏳ 加载榜单...</p>';
            try {
                const data = await api('/toplist/' + name + '?limit=30');
                const tracks = data.tracks || [];
                // 并行获取评论数 (前 30 首)
                const songIds = tracks.map(t => t.id);
                const commentMap = {};
                if (songIds.length) {
                    const promises = songIds.map(id => api('/comment/' + id + '?limit=1').catch(() => ({total: 0})));
                    const results = await Promise.all(promises);
                    songIds.forEach((id, i) => { commentMap[id] = (results[i] || {}).total || 0; });
                }
                el.innerHTML = `
                    <h3>🏆 ${escapeHtml(data.name || name)} <span style="color: #666; font-size: 13px;">前 ${tracks.length} 首</span></h3>
                    ${tracks.map((t, i) => {
                        const ct = commentMap[t.id] || 0;
                        const ctStr = ct > 0 ? ` · 💬${ct.toLocaleString()}` : '';
                        return `
                        <div class="song-card">
                            <div class="num">${i+1}</div>
                            <div class="info">
                                <div class="name">${escapeHtml(t.name)}</div>
                                <div class="meta">${(t.artists || []).map(a => escapeHtml(typeof a === 'string' ? a : a.name || '')).join(' / ')}${ctStr}</div>
                            </div>
                            <div class="actions">
                                <a href="javascript:void(0)" onclick="jumpToComment(${t.id})">💬</a>
                            </div>
                        </div>
                    `;}).join('')}
                `;
            } catch (e) { toast('加载榜单失败', 'error'); el.innerHTML = ''; }
        }


        let qrCheckTimer = null;
        let currentUnikey = null;

        function toggleLoginType() {
            const type = document.getElementById('loginType').value;
            const form = document.getElementById('loginForm');
            if (type === 'qrcode') {
                form.innerHTML = `
                    <p style="color: #16a085; background: #d4edda; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;">
                        ✅ <strong>扫码登录</strong>: 网易云 App → 我的 → 扫一扫 → 扫描下面二维码 → 点击确认登录<br>
                        优势: <strong>更便捷的登录方式</strong>, 
                    </p>
                    <div id="qrcodeArea" style="text-align: center; padding: 20px;">
                        <button class="btn btn-primary" onclick="generateQR()">🔄 生成二维码</button>
                    </div>
                    <div id="qrStatus" style="text-align: center; margin-top: 12px; font-size: 13px; color: #666;"></div>
                `;
            } else if (type === 'cookie') {
                form.innerHTML = `
                    <p style="color: #666; background: #fff3cd; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px;">
                        <strong>Cookie 登录步骤</strong>:<br>
                        1. 浏览器打开 <a href="https://music.163.com" target="_blank">music.163.com</a> 登录<br>
                        2. F12 → Console 输入 <code>document.cookie</code><br>
                        3. 找 <code>MUSIC_U=xxx;</code> 复制 xxx 部分<br>
                        4. 粘贴到下面输入框
                    </p>
                    <div class="form-group">
                        <label>MUSIC_U 值</label>
                        <input id="musicU" placeholder="粘贴 MUSIC_U 值">
                    </div>
                    <button class="btn btn-primary" onclick="doCookieLogin()">Cookie 登录</button>
                    <div id="result" style="margin-top: 12px;"></div>
                `;
            } else {
                form.innerHTML = `
                    <p style="color: #856404; background: #fff3cd; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px;">
                        ⚠️ 密码登录可能被网易云 8821 风控拦截, 失败请用扫码/Cookie
                    </p>
                    <div class="form-group">
                        <label id="accountLabel">手机号</label>
                        <input id="account" placeholder="13800138000">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input id="password" type="password" placeholder="密码">
                    </div>
                    <button class="btn btn-primary" onclick="doLogin()">登录</button>
                    <div id="result" style="margin-top: 12px;"></div>
                `;
                document.getElementById('accountLabel').textContent = type === 'phone' ? '手机号' : '邮箱';
                document.getElementById('account').placeholder = type === 'phone' ? '13800138000' : 'user@example.com';
            }

        async function generateQR() {
            const area = document.getElementById('qrcodeArea');
            const status = document.getElementById('qrStatus');
            area.innerHTML = '<p style="color: #999;">⏳ 生成中...</p>';
            try {
                const data = await api('/login/qrcode');
                if (data.qr_base64) {
                    currentUnikey = data.unikey;
                    area.innerHTML = `
                        <img src="${data.qr_base64}" style="max-width: 280px; border: 1px solid #eee; padding: 8px; background: white;" />
                        <p style="margin-top: 8px; font-size: 11px; color: #999;">${data.qr_url.substring(0, 50)}...</p>
                    `;
                    status.innerHTML = '⏳ 等待扫码...';
                    // 启动轮询
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                    qrCheckTimer = setInterval(() => checkQR(), 2000);
                    // 3 分钟自动停止
                    setTimeout(() => {
                        if (qrCheckTimer) { clearInterval(qrCheckTimer); status.innerHTML = '⏰ 二维码可能已过期, 请重新生成'; }
                    }, 180000);
                } else {
                    area.innerHTML = '<p style="color: #dc3545;">❌ 生成失败</p>';
                }
            } catch (e) { area.innerHTML = '<p style="color: #dc3545;">❌ ' + e.message + '</p>'; }
        }

        async function checkQR() {
            if (!currentUnikey) return;
            try {
                const data = await api('/login/qrcode/check', {unikey: currentUnikey});
                const status = document.getElementById('qrStatus');
                if (data.status === 0) {
                    status.innerHTML = '📱 等待扫码... (用网易云 App)';
                } else if (data.status === 1) {
                    status.innerHTML = '✅ 已扫码, 请在手机上<strong>点确认</strong>';
                } else if (data.status === 2 || data.status === 803) {
                    status.innerHTML = `<span style="color: #28a745; font-size: 16px;">🎉 登录成功: ${escapeHtml(data.nickname || data.user_id)}</span>`;
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                    toast('扫码登录成功!', 'success');
                    setTimeout(() => checkLogin(), 1000);
                } else if (data.status === 8821) {
                    status.innerHTML = '<span style="color: #dc3545;">⏰ 二维码已过期, 请重新生成</span>';
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                } else {
                    status.innerHTML = `状态: ${data.message} (code=${data.code})`;
                }
            } catch (e) { /* 忽略单次错误 */ }
        }

        async function doCookieLogin() {
            const musicU = document.getElementById('musicU').value.trim();
            const r = document.getElementById('result');
            if (!musicU) { toast('请粘贴 MUSIC_U 值', 'error'); return; }
            r.innerHTML = '<p style="color: #999;">⏳ 登录中...</p>';
            try {
                const data = await api('/login/cookie', {music_u: musicU}, 'POST');
                if (data.success) {
                    checkLogin();
                    r.innerHTML = `<div class="login-status logged-in">✅ 登录成功 · ${escapeHtml(data.nickname || '')} (uid: ${data.user_id})<br><a href="javascript:void(0)" onclick="showPage('my-music')">查看我的音乐</a></div>`;
                } else {
                    toast('登录失败: ' + data.error, 'error');
                    r.innerHTML = `<div class="login-status logged-out">❌ ${escapeHtml(data.error)}<br><small>提示: 请确认 MUSIC_U 是从已登录的 music.163.com 复制的</small></div>`;
                }
            } catch (e) { toast('登录失败', 'error'); r.innerHTML = `<div class="login-status logged-out">❌ 服务异常, 请稍后再试</div>`; }
        }

        async function doLogin() {
            const type = document.getElementById('loginType').value;
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            const r = document.getElementById('result');
            if (!account || !password) { toast('请输入账号密码', 'error'); return; }
            r.innerHTML = '<p style="color: #999;">⏳ 登录中...</p>';
            try {
                const data = await api('/login/' + type, {account, password}, 'POST');
                if (data.success) {
                    checkLogin();
                    r.innerHTML = `<div class="login-status logged-in">✅ 登录成功 · ${escapeHtml(data.nickname || '')}<br><a href="javascript:void(0)" onclick="showPage('my-music')">查看我的音乐</a></div>`;
                } else {
                    toast('登录失败', 'error');
                    r.innerHTML = `<div class="login-status logged-out">❌ 登录失败<br><small>密码登录可能被风控, 建议使用扫码或 Cookie 登录</small></div>`;
                }
            } catch (e) { toast('登录失败', 'error'); r.innerHTML = `<div class="login-status logged-out">❌ 服务异常, 请稍后再试</div>`; }
        }

        async function myPlaylists() {

                        <p style="color: #666; font-size: 13px; margin-top: 8px;">

        async function randomCrawlNow() {

            r.innerHTML = '<p style="color: #999;">⏳ 跑一轮中... (目标 10 首, 大约 2-3 分钟)</p>';

                    const s = data.stats;

                            ✅ 本轮: 新入库 <strong>${s.songs_new}</strong> 首 · 重复 ${s.songs_dup} · 评论 ${s.comments_new} 条<br>
                            今日累计: <strong>${data.today_count}</strong> / ${data.today_target} 首
                        </div>
                    `;
                } else {
                    r.innerHTML = '<pre>' + escapeHtml(JSON.stringify(data, null, 2)) + '</pre>';

        async function loadKeywords() {
            const r = document.getElementById('result');

        async function addKeyword() {
            const inp = document.getElementById('newKeyword');
            const kw = (inp.value || '').trim();
            if (!kw) { toast('请输入关键词', 'error'); return; }
            try {
                const data = await api('/random/keywords/add', {keyword: kw}, 'POST');
                if (data.success) {
                    toast('✅ 已添加: ' + kw, 'success');
                    inp.value = '';
                    loadKeywords();
                } else {
                    toast('❌ ' + (data.error || '添加失败'), 'error');
                }
            } catch (e) {
                // 错误信息可能是敏感词拒绝
                const msg = (e.message || '').includes('敏感') ? '❌ 含敏感词, 已拒绝' : '❌ 添加失败: ' + e.message;
                toast(msg, 'error');
            }
        }

        async function deleteKeyword(kw) {
            if (!confirm('确认删除关键词 "' + kw + '"?')) return;
            try {
                await api('/random/keywords/delete', {keyword: kw}, 'POST');
                toast('✅ 已删除: ' + kw, 'success');
                loadKeywords();
            } catch (e) { toast('删除失败: ' + e.message, 'error'); }

                            <div style="font-size: 32px; font-weight: bold;">${s.crawler_today_count} / ${s.crawler_target}</div>
                            <div>今日目标 (${pct}%)</div>

        // ==================== 导航 ====================
        function showPage(name) {
            currentPage = name;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.page === name));
            document.getElementById('content').innerHTML = pages[name].render();
            if (pages[name].onShow) pages[name].onShow();
        }

        document.querySelectorAll('.menu-item').forEach(el => {
            el.addEventListener('click', () => showPage(el.dataset.page));
        });

        // 初始
        showPage('search');
        checkLogin();
    </script>
