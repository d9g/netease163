<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>netease163 — 网易云音乐爬虫</title>
    <style>

            display: grid;

            gap: 20px;

            background: white;

        }
        .sidebar h3 {

        .menu-item {

        .result {
            margin-top: 20px;

            border-radius: 8px;
            padding: 16px;
            max-height: 600px;
            overflow-y: auto;
        }
        .result pre {

        .song-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s;
        }
        .song-card:hover { background: #f0f3ff; transform: translateX(4px); }
        .song-card .num {
            color: #999;

        }
        .song-card .info { flex: 1; }

        }

        }
        .lyric-box {
            background: #1a1a1a;
            color: #f0f0f0;
            padding: 24px;
            border-radius: 8px;
            font-size: 14px;

            max-height: 500px;
            overflow-y: auto;
            font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif;

        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;

            font-size: 14px;

        .login-status {

            margin-bottom: 16px;

        .toast {

            right: 20px;

            background: #333;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;

        }
        .toast.show { opacity: 1; }
        .toast.error { background: #dc3545; }
        .toast.success { background: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 netease163 <span class="badge">v0.2.0</span></h1>
            <div class="subtitle">网易云音乐爬虫服务 · 借鉴 163yinyue + NetCloud · pyncm 底层</div>
            <div class="nav">
                <a href="/docs" target="_blank">📚 API 文档 (Swagger)</a>
                <a href="/redoc" target="_blank">📖 API 文档 (ReDoc)</a>
                <a href="/health" target="_blank">❤️ 健康检查</a>
            </div>
        </div>

        <div id="loginStatus" class="login-status logged-out">
            🔒 未登录 · 登录后可访问私人歌单/推荐/FM
        </div>

        <div class="grid">
            <div class="sidebar">
                <h3>功能</h3>
                <button class="menu-item active" data-page="search">🔍 搜索</button>
                <button class="menu-item" data-page="lyric">📝 歌词</button>
                <button class="menu-item" data-page="comment">💬 评论</button>
                <button class="menu-item" data-page="song">🎵 歌曲详情</button>
                <button class="menu-item" data-page="playlist">📋 歌单</button>
                <button class="menu-item" data-page="artist">👤 歌手</button>
                <button class="menu-item" data-page="album">💿 专辑</button>
                <button class="menu-item" data-page="radio">📻 电台</button>
                <button class="menu-item" data-page="toplist">🏆 排行榜</button>
                <button class="menu-item" data-page="random" style="margin-top: 12px; color: #16a085;">🎲 随机爬取</button>
                <button class="menu-item" data-page="stats" style="color: #16a085;">📊 爬取统计</button>
                <button class="menu-item" data-page="login" style="margin-top: 12px; color: #c20c0c;">🔐 登录</button>
                <button class="menu-item" data-page="my-music" style="color: #c20c0c;">❤️ 我的音乐</button>
            </div>

            <div class="content" id="content">
                <!-- 内容动态加载 -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ==================== 状态 ====================
        const API_BASE = '/api/v1';
        let currentPage = 'search';

        // ==================== 工具 ====================
        async function api(path, params = {}, method = 'GET') {
            const url = new URL(API_BASE + path, window.location.origin);
            // 后端用 Query 类型, GET 和 POST 都通过 query string 传参
            Object.keys(params).forEach(k => {
                if (params[k] !== undefined && params[k] !== '') {
                    url.searchParams.append(k, params[k]);
                }
            });
            const opts = { method };
            const resp = await fetch(url, opts);
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({error: resp.statusText}));
                throw new Error(err.error || err.detail || `HTTP ${resp.status}`);
            }
            return resp.json();
        }

        function toast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.className = 'toast', 3000);
        }

        function escapeHtml(s) {
            if (!s) return '';
            return s.toString().replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function checkLogin() {
            try {
                const data = await api('/login/status');
                const el = document.getElementById('loginStatus');
                if (data.logged_in) {
                    el.className = 'login-status logged-in';
                    el.innerHTML = `✅ 已登录 · <strong>${escapeHtml(data.nickname || data.user_id)}</strong> · <a href="javascript:void(0)" onclick="logout()">登出</a>`;
                } else {
                    el.className = 'login-status logged-out';
                    el.innerHTML = `🔒 未登录 · <a href="javascript:void(0)" onclick="showPage('login')">立即登录</a>`;
                }
            } catch (e) {
                console.error('login status check failed', e);
            }
        }

        async function logout() {
            try {
                await api('/login/logout', {}, 'POST');
                toast('已登出', 'success');
                checkLogin();
            } catch (e) {
                toast('登出失败: ' + e.message, 'error');
            }
        }

        // ==================== 页面 ====================
        const pages = {
            search: {
                title: '🔍 搜索',
                render: () => `
                    <h2>🔍 搜索</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>关键词</label>
                            <input id="kw" placeholder="林俊杰 / 江南 / 周杰伦" value="林俊杰">
                        </div>
                        <div class="form-group">
                            <label>类型</label>
                            <select id="type">
                                <option value="song">歌曲</option>
                                <option value="artist">歌手</option>
                                <option value="album">专辑</option>
                                <option value="playlist">歌单</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>条数</label>
                            <input id="limit" type="number" value="10" min="1" max="100">
                        </div>
                        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
                    </div>
                    <div id="result"></div>
                `
            },
            lyric: {
                title: '📝 歌词',
                render: () => `
                    <h2>📝 歌词</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>歌曲 ID</label>
                            <input id="songId" placeholder="1062642" value="1062642">
                        </div>
                        <button class="btn btn-primary" onclick="doLyric()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            comment: {
                title: '💬 评论',
                render: () => `
                    <h2>💬 评论</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>歌曲 ID</label>
                            <input id="songId" placeholder="1062642" value="1062642">
                        </div>
                        <div class="form-group">
                            <label>条数</label>
                            <input id="limit" type="number" value="20" min="1" max="100">
                        </div>
                        <div class="form-group">
                            <label>分页偏移</label>
                            <input id="offset" type="number" value="0" min="0">
                        </div>
                        <button class="btn btn-primary" onclick="doComment()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            song: {
                title: '🎵 歌曲详情',
                render: () => `
                    <h2>🎵 歌曲详情</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>歌曲 ID</label>
                            <input id="songId" placeholder="1062642" value="1062642">
                        </div>
                        <button class="btn btn-primary" onclick="doSong()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            playlist: {
                title: '📋 歌单',
                render: () => `
                    <h2>📋 歌单详情</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>歌单 ID (例: 19723756=飙升榜)</label>
                            <input id="playlistId" value="19723756">
                        </div>
                        <button class="btn btn-primary" onclick="doPlaylist()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            artist: {
                title: '👤 歌手',
                render: () => `
                    <h2>👤 歌手详情</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>歌手 ID</label>
                            <input id="artistId" placeholder="5781" value="5781">
                        </div>
                        <button class="btn btn-primary" onclick="doArtist()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            album: {
                title: '💿 专辑',
                render: () => `
                    <h2>💿 专辑详情</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>专辑 ID</label>
                            <input id="albumId" value="110808">
                        </div>
                        <button class="btn btn-primary" onclick="doAlbum()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            radio: {
                title: '📻 电台',
                render: () => `
                    <h2>📻 电台节目</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>电台 ID</label>
                            <input id="radioId" value="350">
                        </div>
                        <div class="form-group">
                            <label>条数</label>
                            <input id="limit" type="number" value="20" min="1" max="100">
                        </div>
                        <button class="btn btn-primary" onclick="doRadio()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            random: {
                title: '🎲 随机爬取',
                render: () => `
                    <h2>🎲 随机爬取 · 后台定时</h2>
                    <p style="color: #666; font-size: 13px; margin-bottom: 20px;">
                        选项 C: <strong>榜单 70% + 关键词 30% 混合</strong> · 每天 100+ 首 · 反爬随机间隔 8-25s<br>
                        每 30 分钟自动跑一轮 · 凌晨 02:00 自动扩展关键词池
                    </p>
                    <div class="form-row">
                        <button class="btn btn-primary" onclick="randomCrawlNow()">🏃 手动跑一轮</button>
                        <button class="btn btn-primary" onclick="loadLatestSongs()">🎵 最新入库</button>
                        <button class="btn btn-primary" onclick="loadKeywords()">📚 关键词池</button>
                        <button class="btn btn-primary" onclick="extendKeywords()">📈 手动扩词</button>
                    </div>
                    <div id="result" style="margin-top: 20px;"></div>
                `
            },
            stats: {
                title: '📊 爬取统计',
                render: () => `
                    <h2>📊 爬取统计</h2>
                    <p style="color: #666; font-size: 13px; margin-bottom: 20px;">
                        实时统计 - 歌曲数 / 评论数 / 爬取成功率 / 今日目标进度
                    </p>
                    <button class="btn btn-primary" onclick="loadStats()">🔄 刷新</button>
                    <div id="result" style="margin-top: 20px;"></div>
                `
            },
            toplist: {
                title: '🏆 排行榜',
                render: () => `
                    <h2>🏆 排行榜</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>榜单</label>
                            <select id="name">
                                <option value="hot">热歌榜</option>
                                <option value="soar">飙升榜</option>
                                <option value="new">新歌榜</option>
                                <option value="original">原创榜</option>
                                <option value="electronic">电音榜</option>
                                <option value="ACG">ACG 榜</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>条数</label>
                            <input id="limit" type="number" value="30" min="1" max="200">
                        </div>
                        <button class="btn btn-primary" onclick="doToplist()">查询</button>
                    </div>
                    <div id="result"></div>
                `
            },
            login: {
                title: '🔐 登录',
                onShow: () => { setTimeout(() => toggleLoginType(), 50); },
                render: () => `
                    <h2>🔐 网易云登录</h2>
                    <p style="color: #666; font-size: 13px; margin-bottom: 16px;">
                        登录后可访问: 我的歌单 · 私人 FM · 每日推荐 · 关注数据<br>
                        登录态保存在服务端, 30 天免重复登录
                    </p>
                    <div class="form-group">
                        <label>登录方式</label>
                        <select id="loginType" onchange="toggleLoginType()">
                            <option value="qrcode">📱 扫码登录 (推荐, 绕过风控)</option>
                            <option value="cookie">🍪 Cookie 登录 (兜底)</option>
                            <option value="phone">📱 手机密码 (可能被风控)</option>

            'my-music': {
                title: '❤️ 我的音乐',
                render: () => `
                    <h2>❤️ 我的音乐</h2>

                        ⚠️ 此功能需要登录态, 未登录会返回 401 错误
                    </p>
                    <div class="form-row">
                        <button class="btn btn-primary" onclick="myFav()">❤️ 我的红心歌单</button>
                        <button class="btn btn-primary" onclick="myRecommend()">🎁 每日推荐</button>
                        <button class="btn btn-primary" onclick="myFM()">🎵 私人 FM</button>
                    </div>
                    <div id="result"></div>

        // ==================== 操作 ====================
        async function doSearch() {
            const kw = document.getElementById('kw').value;
            const type = document.getElementById('type').value;
            const limit = document.getElementById('limit').value;
            const r = document.getElementById('result');
            r.innerHTML = '<p style="color: #999;">⏳ 搜索中...</p>';
            try {
                const data = await api('/search', {q: kw, type, limit});
                if (data.items.length === 0) {
                    r.innerHTML = '<p style="color: #999;">无结果</p>';
                    return;
                }
                if (type === 'song') {
                    r.innerHTML = data.items.map((s, i) => `
                        <div class="song-card" onclick="fillSongId(${s.id})">
                            <div class="num">${i+1}</div>
                            <div class="info">
                                <div class="name">${escapeHtml(s.name)}</div>
                                <div class="meta">${s.artists.map(escapeHtml).join(' / ')} · ${escapeHtml(s.album)}</div>
                            </div>
                        </div>
                    `).join('');
                } else if (type === 'artist') {
                    r.innerHTML = data.items.map(a => `
                        <div class="song-card" onclick="document.getElementById('artistId').value=${a.id};showPage('artist')">
                            <div class="info"><div class="name">${escapeHtml(a.name)}</div><div class="meta">${escapeHtml((a.alias || []).join(' / '))}</div></div>
                        </div>
                    `).join('');
                } else {
                    r.innerHTML = `<pre>${escapeHtml(JSON.stringify(data.items, null, 2))}</pre>`;
                }
            } catch (e) { toast('搜索失败: ' + e.message, 'error'); r.innerHTML = ''; }
        }

        function fillSongId(id) {
            document.getElementById('songId').value = id;
            showPage('lyric');
        }

        async function doLyric() {
            const songId = document.getElementById('songId').value;
            const r = document.getElementById('result');

        async function generateQR() {
            const area = document.getElementById('qrcodeArea');
            const status = document.getElementById('qrStatus');
            area.innerHTML = '<p style="color: #999;">⏳ 生成中...</p>';
            try {
                const data = await api('/login/qrcode');
                if (data.qr_base64) {
                    currentUnikey = data.unikey;
                    area.innerHTML = `
                        <img src="${data.qr_base64}" style="max-width: 280px; border: 1px solid #eee; padding: 8px; background: white;" />
                        <p style="margin-top: 8px; font-size: 11px; color: #999;">${data.qr_url.substring(0, 50)}...</p>
                    `;
                    status.innerHTML = '⏳ 等待扫码...';
                    // 启动轮询
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                    qrCheckTimer = setInterval(() => checkQR(), 2000);
                    // 3 分钟自动停止
                    setTimeout(() => {
                        if (qrCheckTimer) { clearInterval(qrCheckTimer); status.innerHTML = '⏰ 二维码可能已过期, 请重新生成'; }
                    }, 180000);
                } else {
                    area.innerHTML = '<p style="color: #dc3545;">❌ 生成失败</p>';
                }
            } catch (e) { area.innerHTML = '<p style="color: #dc3545;">❌ ' + e.message + '</p>'; }
        }

        async function checkQR() {
            if (!currentUnikey) return;
            try {
                const data = await api('/login/qrcode/check', {unikey: currentUnikey});
                const status = document.getElementById('qrStatus');
                if (data.status === 0) {
                    status.innerHTML = '📱 等待扫码... (用网易云 App)';
                } else if (data.status === 1) {
                    status.innerHTML = '✅ 已扫码, 请在手机上<strong>点确认</strong>';
                } else if (data.status === 2 || data.status === 803) {
                    status.innerHTML = `<span style="color: #28a745; font-size: 16px;">🎉 登录成功: ${escapeHtml(data.nickname || data.user_id)}</span>`;
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                    toast('扫码登录成功!', 'success');
                    setTimeout(() => checkLogin(), 1000);
                } else if (data.status === 8821) {
                    status.innerHTML = '<span style="color: #dc3545;">⏰ 二维码已过期, 请重新生成</span>';
                    if (qrCheckTimer) clearInterval(qrCheckTimer);
                } else {
                    status.innerHTML = `状态: ${data.message} (code=${data.code})`;
                }
            } catch (e) { /* 忽略单次错误 */ }
        }
